parameters:
  - name: workingDirectory
    type: string
  - name: backendServiceConnection
    type: string
  - name: backendResourceGroup
    type: string
  - name: backendStorageAccount
    type: string
  - name: backendContainer
    type: string
  - name: backendKey
    type: string
  - name: tfVarsFile
    type: string
  - name: planArtifactName
    type: string

steps:
  - task: TerraformTaskV4@4
    displayName: 'Terraform Init'
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '${{ parameters.workingDirectory }}'
      backendServiceArm: '${{ parameters.backendServiceConnection }}'
      backendAzureRmResourceGroupName: '${{ parameters.backendResourceGroup }}'
      backendAzureRmStorageAccountName: '${{ parameters.backendStorageAccount }}'
      backendAzureRmContainerName: '${{ parameters.backendContainer }}'
      backendAzureRmKey: '${{ parameters.backendKey }}'
      backendAzureRmUseEntraIdAuth: true 

  - task: TerraformTaskV4@4
    displayName: 'Terraform Plan'
    inputs:
      provider: 'azurerm'
      command: 'plan'
      workingDirectory: '${{ parameters.workingDirectory }}'
      commandOptions: '-var-file=${{ parameters.tfVarsFile }} -out=$(Build.ArtifactStagingDirectory)/tfplan'
      environmentServiceNameAzureRM: '${{ parameters.backendServiceConnection }}'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Plan Artifact'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
      artifact: '${{ parameters.planArtifactName }}'
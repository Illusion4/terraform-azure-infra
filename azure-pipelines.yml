trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - '**/*.tf'
      - 'environments/**/*.tfvars'

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: terraformVersion
    value: '1.6.0'
  - name: backendServiceConnection
    value: 'Azure-Service-Connection-v2'
  - name: backendResourceGroup
    value: 'terraform-state-rg'
  - name: backendStorageAccount
    value: 'tfstateprojectdev'
  - name: backendContainer
    value: 'tfstate'
  - name: backendKey
    value: 'terraform.tfstate'

stages:
  - stage: Validate
    displayName: 'Validate Terraform'
    jobs:
      - job: ValidateJob
        displayName: 'Validation Checks'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - script: terraform fmt -check -recursive
            displayName: 'Terraform Format Check'
            continueOnError: false 

          - script: terraform init -backend=false
            displayName: 'Terraform Init (Backendless)'

          - script: terraform validate
            displayName: 'Terraform Validate'

  - stage: PlanDev
    displayName: 'Plan - Development'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: PlanDevJob
        displayName: 'Plan Dev'
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: '$(backendServiceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'
              backendAzureRmUseEntraIdAuth: true 

          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              commandOptions: '-var-file=environments/dev.tfvars -out=$(System.DefaultWorkingDirectory)/tfplan'
              environmentServiceNameAzureRM: '$(backendServiceConnection)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Plan Artifact'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/tfplan'
              artifact: 'dev-tfplan'

  - stage: ApplyDev
    displayName: 'Apply - Development'
    dependsOn: PlanDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployDev
        displayName: 'Deploy to Development'
        environment: 'development'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Plan Artifact'
                  inputs:
                    artifact: 'dev-tfplan'
                    path: '$(System.DefaultWorkingDirectory)'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    backendServiceArm: '$(backendServiceConnection)'
                    backendAzureRmResourceGroupName: '$(backendResourceGroup)'
                    backendAzureRmStorageAccountName: '$(backendStorageAccount)'
                    backendAzureRmContainerName: '$(backendContainer)'
                    backendAzureRmKey: '$(backendKey)'
                    backendAzureRmUseEntraIdAuth: true

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    commandOptions: '$(System.DefaultWorkingDirectory)/tfplan'
                    environmentServiceNameAzureRM: '$(backendServiceConnection)'
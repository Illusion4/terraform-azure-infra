trigger:
  branches:
    include:
      - master
      - develop

pool:
  name: 'Default'
  demands:
    - agent.name -equals WSL-Agent

variables:
  - name: terraformVersion
    value: '1.13.0'
  - name: tfWorkingDir
    value: '$(System.DefaultWorkingDirectory)/terraform'
  # Backend Config
  - name: backendServiceConnection
    value: 'Azure-Service-Connection-v2'
  - name: backendResourceGroup
    value: 'terraform-state-rg'
  - name: backendStorageAccount
    value: 'tfstateprojectdev'
  - name: backendContainer
    value: 'tfstate'
  - name: backendKey
    value: 'dev/terraform.tfstate'

stages:
  - stage: Validate
    displayName: 'Validate Terraform'
    jobs:
      - job: ValidateJob
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          - script: terraform fmt -check -recursive
            workingDirectory: '$(tfWorkingDir)'
            continueOnError: false 
          - script: terraform init -backend=false
            workingDirectory: '$(tfWorkingDir)'
          - script: terraform validate
            workingDirectory: '$(tfWorkingDir)'

  - stage: PlanDev
    displayName: 'Plan - Development'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: PlanDevJob
        steps:
          - template: templates/steps-plan.yml
            parameters:
              workingDirectory: $(tfWorkingDir)
              backendServiceConnection: $(backendServiceConnection)
              backendResourceGroup: $(backendResourceGroup)
              backendStorageAccount: $(backendStorageAccount)
              backendContainer: $(backendContainer)
              backendKey: $(backendKey)
              tfVarsFile: 'environments/dev.tfvars'
              planArtifactName: 'dev-tfplan'

  - stage: ApplyDev
    displayName: 'Apply - Development'
    dependsOn: PlanDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployDev
        environment: 'development'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/steps-apply.yml
                  parameters:
                    workingDirectory: $(tfWorkingDir)
                    backendServiceConnection: $(backendServiceConnection)
                    backendResourceGroup: $(backendResourceGroup)
                    backendStorageAccount: $(backendStorageAccount)
                    backendContainer: $(backendContainer)
                    backendKey: $(backendKey)
                    planArtifactName: 'dev-tfplan'
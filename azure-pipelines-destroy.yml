# MANUAL TRIGGER ONLY (Safety First!)
trigger: none
pr: none

pool:
  name: 'Default'
  demands:
   - agent.name -equals WSL-Agent

variables:
  - name: terraformVersion
    value: '1.6.0'
  - name: backendServiceConnection
    value: 'Azure-Service-Connection-v2'
  - name: backendResourceGroup
    value: 'terraform-state-rg'
  - name: backendStorageAccount
    value: 'tfstateprojectdev'
  - name: backendContainer
    value: 'tfstate'
  - name: backendKey
    value: 'terraform.tfstate'

stages:
  - stage: Destroy
    displayName: 'Destroy Infrastructure'
    jobs:
      - job: DestroyJob
        displayName: 'Terraform Destroy'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              backendServiceArm: '$(backendServiceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'
              backendAzureRmUseEntraIdAuth: true

          - task: TerraformTaskV4@4
            displayName: 'Terraform Destroy'
            inputs:
              provider: 'azurerm'
              command: 'destroy'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              environmentServiceNameAzureRM: '$(backendServiceConnection)'
              commandOptions: '-var-file=environments/dev.tfvars -auto-approve'